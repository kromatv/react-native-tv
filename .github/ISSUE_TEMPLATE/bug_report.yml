name: Bug report
description: Something in a runtime, a CLI, a simulator or the shared setup is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue. Title format: `<area>: <what is broken>`, for example
        `input: Back exits the app from a nested screen`.

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@kromatv/react-native-tizen (Samsung)"
        - "@kromatv/react-native-webos (LG)"
        - "@kromatv/react-native-tv (the shared setup)"
        - More than one, or not sure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where it breaks
      options:
        - On a TV
        - In the simulator
        - Building, packaging or signing
        - Installing or running on a TV (devices, run, logs)
        - Metro, bundling or Expo CLI
        - Something else
    validations:
      required: true

  - type: input
    id: tv
    attributes:
      label: TV model and year
      description: The model code from the TV's settings or from `rn-tizen devices` or `rn-webos devices`, or `simulator`.
      placeholder: "QE55Q80C, 2023"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Tizen or webOS version
      description: "`rn-tizen devices` and `rn-webos devices` print it for every connected TV."
      placeholder: "Tizen 9.0"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: The packages from this repository, react-native, expo, and your OS.
      placeholder: "@kromatv/react-native-tizen 0.1.0, react-native-tvos 0.88.0-0, expo 58.0.16, macOS 26.1"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a fresh start. A small app or a change to the package's `example/` that shows it is ideal.
      placeholder: |
        1. rn-tizen run --device 192.168.1.50
        2. Press Down twice, then Enter
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
      placeholder: |
        Expected: the second row gets the focus.
        Actual: the focus stays on the first row.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`doctor` output"
      description: Run `rn-tizen doctor` or `rn-webos doctor` in the app's directory and paste everything it prints.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The app's logs from `run --level debug` or `logs --level debug`. For a build failure, the output of the failing command with `--verbose`. For a native crash, the backtrace (`simulator crash` in the simulator). Cut it to the part around the failure.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for this
          required: true
        - label: I removed IP addresses, DUIDs, certificate names, passphrases, keys and tokens I do not want public
          required: true
