# Draft for the monorepo: never run on GitHub.
name: Package

on:
  workflow_call:
    inputs:
      package:
        description: The directory in packages/ to check.
        type: string
        required: true
      native:
        description: Compile and test the native runtime.
        type: boolean
        default: false
      native-apt-packages:
        description: What the native job installs with apt.
        type: string
        default: ''
      native-cache-paths:
        description: What the native job keeps between runs, one path per line.
        type: string
        default: ''
      pull-request-ccache:
        description: Keep a pull request's compiled objects between its pushes.
        type: boolean
        default: false
      packed:
        description: Run the package's check:packed script.
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13'
          package-manager-cache: false
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run typecheck
      - run: bun run test --coverage
      - run: bun run check
      - run: bun run build
      - name: The compiled CLI runs on the oldest Node it supports
        run: node dist/cli/main.js --version
      - name: Install ShellCheck
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: ShellCheck
        run: |
          shellcheck --version
          if [ -d simulator ]; then find simulator -name '*.sh' -print0 | xargs -0 shellcheck -x; fi

  packed:
    name: Packed install (Node)
    if: inputs.packed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13'
          package-manager-cache: false
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: npm pack, install into a fresh Expo app, bundle under Node
        run: bun run check:packed

  native:
    name: Native runtime (simulator, aarch64 Linux)
    if: inputs.native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CCACHE_MAXSIZE: 2G
    defaults:
      run:
        working-directory: packages/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Install the build tools
        env:
          DEBIAN_FRONTEND: noninteractive
          PACKAGES: ${{ inputs.native-apt-packages }}
        run: |
          sudo apt-get update -q
          # shellcheck disable=SC2086
          sudo apt-get install -y -q --no-install-recommends $PACKAGES
          clang --version
          cmake --version
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
      - id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.native-cache-paths }}
          key: native-${{ inputs.package }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('packages/{0}/runtime/dependencies.json', inputs.package), 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            native-${{ inputs.package }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('packages/{0}/runtime/dependencies.json', inputs.package), 'bun.lock') }}-
            native-${{ inputs.package }}-${{ runner.os }}-${{ runner.arch }}-
      # A pull request keeps its own compiled objects between pushes: main's
      # cache alone leaves every push to compile again whatever its changes touch.
      - id: pull-request-ccache
        if: inputs.pull-request-ccache && github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ inputs.package }}-pull-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.package }}-pull-${{ github.event.pull_request.number }}-
      - run: ccache --zero-stats
      - name: Compile the runtime
        run: bun scripts/compile-simulator-runtime.ts example
      - name: Test the runtime
        run: bun scripts/test-runtime.ts example --coverage coverage/runtime.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-coverage-${{ inputs.package }}
          path: packages/${{ inputs.package }}/coverage/runtime.xml
          if-no-files-found: error
          retention-days: 7
      - run: ccache --show-stats
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.native-cache-paths }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - if: ${{ !cancelled() && inputs.pull-request-ccache && github.event_name == 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.pull-request-ccache.outputs.cache-primary-key }}

  sonar:
    name: SonarCloud
    needs: native
    if: >-
      !cancelled()
      && needs.native.result != 'failure'
      && github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run test --coverage
      - if: needs.native.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-coverage-${{ inputs.package }}
          path: packages/${{ inputs.package }}/coverage
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          projectBaseDir: packages/${{ inputs.package }}
          args: >-
            ${{ github.event_name != 'pull_request' &&
            format('-Dsonar.branch.name={0}', github.ref_name) || '' }}
            ${{ needs.native.result == 'success' &&
            '-Dsonar.coverageReportPaths=coverage/runtime.xml' || '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
