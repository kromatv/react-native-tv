# Draft for the monorepo: never run on GitHub.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull requests and draft releases
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Refuse to run without the release app
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Set the RELEASE_APP_CLIENT_ID variable and the RELEASE_APP_PRIVATE_KEY secret: CONTRIBUTING.md, Releases, says how."
            exit 1
          fi

      # A pull request opened with GITHUB_TOKEN runs no workflow until someone
      # approves it, and only the app can pass the ruleset on release tags.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}

      - id: packages
        name: List the packages released
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          jq --compact-output '
            . as $outputs
            | (.paths_released // "[]" | fromjson)
            | map({
                package: (split("/") | last),
                tag: $outputs["\(.)--tag_name"],
                version: $outputs["\(.)--version"],
                sha: $outputs["\(.)--sha"]
              })
          ' <<< "$OUTPUTS" | sed 's/^/packages=/' | tee -a "$GITHUB_OUTPUT"

  pack:
    name: Check and pack (${{ matrix.package }})
    needs: release-please
    if: >-
      !cancelled()
      && (github.event_name == 'pull_request' || needs.release-please.outputs.created == 'true')
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"package":"react-native-tizen"},{"package":"react-native-tv"},{"package":"react-native-webos"}]'
          || needs.release-please.outputs.packages) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Refuse a private package or repository
        env:
          PACKAGE: ${{ matrix.package }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$(jq -r '.private // false' package.json)" = "true" ]; then
            echo "::error file=packages/$PACKAGE/package.json::package.json is \"private\": true. Remove that line in a commit, then release that commit."
            exit 1
          fi
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "::error::npm signs provenance only for packages built in a public repository. Make the repository public first."
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile
        working-directory: .

      - name: Read the version and its dist-tag
        id: version
        env:
          RELEASED: ${{ matrix.version }}
        run: |
          version="$(jq -r .version package.json)"
          if [ -n "$RELEASED" ] && [ "$RELEASED" != "$version" ]; then
            echo "::error::Release Please released $RELEASED, but package.json at that commit says $version."
            exit 1
          fi
          bun scripts/print-dist-tag.ts | tee -a "$GITHUB_OUTPUT"

      - run: bun run typecheck
      - run: bun run test
      - run: bun run check

      - name: Pack the tarball
        run: |
          mkdir "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Publish, as a dry run
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: npm publish "$RUNNER_TEMP"/package/*.tgz --dry-run --access public --tag "$DIST_TAG"

      # The jobs of a matrix share one set of outputs, so the dist-tag of each
      # package travels with its tarball.
      - name: Keep the dist-tag with the tarball
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: printf '%s\n' "$DIST_TAG" > "$RUNNER_TEMP/package/dist-tag"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.package }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm and the GitHub release (${{ matrix.package }})
    needs: [release-please, pack]
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-please.outputs.packages) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@kromatv/${{ matrix.package }}/v/${{ matrix.version }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: npm supports trusted publishing
        run: |
          npm --version
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ matrix.package }}
          path: ${{ runner.temp }}/package

      # npm's trusted publisher for each package names this file and the npm
      # environment: renaming either stops publishing until npm trust is redone.
      - name: Publish
        env:
          NAME: '@kromatv/${{ matrix.package }}'
          VERSION: ${{ matrix.version }}
        run: |
          dist_tag="$(cat "$RUNNER_TEMP/package/dist-tag")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is on npm already: a re-run, so only the GitHub release is left."
          else
            npm publish "$RUNNER_TEMP"/package/*.tgz --provenance --access public --tag "$dist_tag"
          fi

      - name: Attach the tarball and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/package/*.tgz --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
