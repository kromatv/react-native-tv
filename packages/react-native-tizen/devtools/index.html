<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>react-native-tizen</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 0; display: flex; height: 100vh; color: #1b1f24; }
      nav { width: 18rem; border-right: 1px solid #d0d7de; overflow-y: auto; }
      nav h1 { font-size: 1rem; margin: 1rem; }
      nav a { display: block; padding: 0.5rem 1rem; color: inherit; text-decoration: none; }
      nav a[aria-current] { background: #eaeef2; }
      .status { font-size: 0.8rem; color: #57606a; }
      main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      header { display: flex; gap: 1rem; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid #d0d7de; }
      header h2 { font-size: 1rem; margin: 0; flex: 1; }
      pre { flex: 1; margin: 0; padding: 1rem; overflow: auto; background: #0d1117; color: #e6edf3; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <nav>
      <h1>react-native-tizen</h1>
      <div id="jobs"></div>
    </nav>
    <main>
      <header>
        <h2 id="title">Pick a job, or run one with shift+m in <code>expo start</code></h2>
        <span id="status" class="status"></span>
        <button id="stop" type="button" hidden>Stop</button>
      </header>
      <pre id="log"></pre>
    </main>
    <script src="devtools.js"></script>
  </body>
</html>
