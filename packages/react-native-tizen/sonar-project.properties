# evas_object_image_data_copy_set and evas_object_image_memfile_set take a
# non-const `void *` for a buffer they only copy (Evas_Legacy.h), so a const
# buffer is cast for them and never written.
sonar.issue.ignore.multicriteria.renderS859a.ruleKey=cpp:S859
sonar.issue.ignore.multicriteria.renderS859a.resourceKey=runtime/host/src/views/SmartMembers.cpp
sonar.issue.ignore.multicriteria.renderS859b.ruleKey=cpp:S859
