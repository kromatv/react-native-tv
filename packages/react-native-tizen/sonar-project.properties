sonar.projectKey=kromatv_react-native-tizen
sonar.organization=kromatv
sonar.sourceEncoding=UTF-8

sonar.sources=src,runtime,shell,simulator,scripts,react-native-overrides,example/src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.exclusions=src/**/*.test.ts,**/node_modules/**,**/dist/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=runtime/**,shell/**,simulator/**,scripts/**,react-native-overrides/**,example/**
sonar.cpd.exclusions=react-native-overrides/**

sonar.cs.file.suffixes=-

# Reviewed exceptions. Each entry is a rule that is wrong for one file, with the
# reason. Prefer a code fix over a new entry; when a file named here moves, its
# entry moves with it.
sonar.issue.ignore.multicriteria=\
  sysinfokeys,\
  playerstubs,\
  dlogvarargs,\
  rnModulesSpecConst,\
  rnModulesSpecNoOp,\
  rnModulesNetworkingSpec,\
  rnModulesSystemInfoKeys,\
  rnModulesFreeSystemInfo,\
  rnModulesFreeMarkup,\
  rnModulesReplacementCharacter,\
  expoModulesNoOpDirectory,\
  expoModulesNoOpFileSystem,\
  expoModulesCallbackImage,\
  expoModulesBootClock,\
  expoModulesCatchConstants,\
  expoModulesCatchImagePrefetch,\
  expoModulesCatchImageView

# A Tizen system_info key is a URI Samsung spells with http
# ("http://tizen.org/feature/screen.width"). It names a feature the shim answers
# for; nothing fetches it, and the https spelling is a key no TV knows.
sonar.issue.ignore.multicriteria.sysinfokeys.ruleKey=c:S5332
sonar.issue.ignore.multicriteria.sysinfokeys.resourceKey=simulator/shims/src/system_info.c

# The simulator has no player: each stub keeps the exact signature of Tizen's
# media/player.h, which the host compiles against on a TV too, and ignores its
# arguments. A const it adds would no longer match that header.
sonar.issue.ignore.multicriteria.playerstubs.ruleKey=c:S995
sonar.issue.ignore.multicriteria.playerstubs.resourceKey=simulator/shims/src/player.c

# dlog_print is Tizen's variadic logging API, with this signature on a TV; the
# shim forwards to dlog_vprint, and the format attribute checks every caller.
sonar.issue.ignore.multicriteria.dlogvarargs.ruleKey=c:S923
sonar.issue.ignore.multicriteria.dlogvarargs.resourceKey=simulator/shims/src/dlog.c

# cpp:S5817, TurboModule spec methods cannot be const: the generated specs pass &T::method to
# bridging::callFromJs, which takes only a non-const member pointer (ReactCommon/react/bridging/Class.h:14-20).
sonar.issue.ignore.multicriteria.rnModulesSpecConst.ruleKey=cpp:S5817
sonar.issue.ignore.multicriteria.rnModulesSpecConst.resourceKey=runtime/host/src/modules/**/*Module.cpp

# cpp:S1186, spec methods Tizen has nothing to do for (addListener, removeListeners, vibrate, announceForAccessibility...):
# the generated spec requires each one (FBReactNativeSpecJSI.h asserts its arity).
sonar.issue.ignore.multicriteria.rnModulesSpecNoOp.ruleKey=cpp:S1186
sonar.issue.ignore.multicriteria.rnModulesSpecNoOp.resourceKey=runtime/host/src/modules/**/*Module.cpp

# cpp:S107, sendRequest takes the runtime and the nine arguments of React Native's Networking spec
# (src/private/specs_DEPRECATED/modules/NativeNetworkingAndroid.js); the generated spec asserts 10 parameters.
sonar.issue.ignore.multicriteria.rnModulesNetworkingSpec.ruleKey=cpp:S107
sonar.issue.ignore.multicriteria.rnModulesNetworkingSpec.resourceKey=runtime/host/src/modules/NetworkingModule.cpp

# cpp:S5332, http://tizen.org/... strings are system_info keys, identifiers that nothing fetches
# (system/system_info.h, Tizen 9.0 rootstrap).
sonar.issue.ignore.multicriteria.rnModulesSystemInfoKeys.ruleKey=cpp:S5332
sonar.issue.ignore.multicriteria.rnModulesSystemInfoKeys.resourceKey=runtime/host/src/modules/DeviceProfile.cpp

# cpp:S1231, system_info_get_platform_string says "You must release the value using free()" (system_info.h:87);
# evas_textblock_text_utf8_to_markup returns allocated markup (evas_textblock_legacy.h:712).
sonar.issue.ignore.multicriteria.rnModulesFreeSystemInfo.ruleKey=cpp:S1231
sonar.issue.ignore.multicriteria.rnModulesFreeSystemInfo.resourceKey=runtime/host/src/modules/DeviceProfile.cpp
sonar.issue.ignore.multicriteria.rnModulesFreeMarkup.ruleKey=cpp:S1231
sonar.issue.ignore.multicriteria.rnModulesFreeMarkup.resourceKey=runtime/host/src/modules/dialog/AlertDialog.cpp

# cpp:S7040, the bounded form it asks for (\u{FFFD}) is C++23; the runtime builds as C++20 (runtime/CMakeLists.txt).
sonar.issue.ignore.multicriteria.rnModulesReplacementCharacter.ruleKey=cpp:S7040
sonar.issue.ignore.multicriteria.rnModulesReplacementCharacter.resourceKey=runtime/host/src/modules/blob/FileReaderModule.cpp

# cpp:S1186, expo-file-system functions Tizen has nothing to do for: Directory.validatePath and
# cancelDownloadAsync, as there is no download task to cancel (expo-modules-contract.md section 4).
sonar.issue.ignore.multicriteria.expoModulesNoOpDirectory.ruleKey=cpp:S1186
sonar.issue.ignore.multicriteria.expoModulesNoOpDirectory.resourceKey=runtime/host/expo/modules/filesystem/FileSystemDirectory.cpp
sonar.issue.ignore.multicriteria.expoModulesNoOpFileSystem.ruleKey=cpp:S1186
sonar.issue.ignore.multicriteria.expoModulesNoOpFileSystem.resourceKey=runtime/host/expo/modules/filesystem/FileSystemModule.cpp

# cpp:S5008, the void * data of Evas_Object_Event_Cb and Ecore_Timeline_Cb
# (evas-1/Evas_Common.h:482, ecore-1/Ecore_Common.h:2764, Tizen 9.0 rootstrap).
sonar.issue.ignore.multicriteria.expoModulesCallbackImage.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.expoModulesCallbackImage.resourceKey=runtime/host/expo/modules/image/ExpoImageView.cpp

# cpp:S6229, getUptimeAsync reads CLOCK_BOOTTIME, which counts while the TV is in standby;
# std::chrono has no such clock (libstdc++'s steady_clock is CLOCK_MONOTONIC).
sonar.issue.ignore.multicriteria.expoModulesBootClock.ruleKey=cpp:S6229
sonar.issue.ignore.multicriteria.expoModulesBootClock.resourceKey=runtime/host/expo/modules/ExpoDeviceModule.cpp

# cpp:S1181, failures that must reach JavaScript as a result, whatever their type: an unreadable app.config
# leaves the constants without a manifest, a failed download makes Image.prefetch false or sends onError.
sonar.issue.ignore.multicriteria.expoModulesCatchConstants.ruleKey=cpp:S1181
sonar.issue.ignore.multicriteria.expoModulesCatchConstants.resourceKey=runtime/host/expo/modules/ExponentConstantsModule.cpp
sonar.issue.ignore.multicriteria.expoModulesCatchImagePrefetch.ruleKey=cpp:S1181
sonar.issue.ignore.multicriteria.expoModulesCatchImagePrefetch.resourceKey=runtime/host/expo/modules/image/ExpoImageModule.cpp
sonar.issue.ignore.multicriteria.expoModulesCatchImageView.ruleKey=cpp:S1181
sonar.issue.ignore.multicriteria.expoModulesCatchImageView.resourceKey=runtime/host/expo/modules/image/ExpoImageView.cpp
