sonar.projectKey=kromatv_react-native-tizen
sonar.organization=kromatv
sonar.sourceEncoding=UTF-8

sonar.sources=src,runtime,shell,simulator,scripts,react-native-overrides,example/src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.exclusions=src/**/*.test.ts,**/node_modules/**,**/dist/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=runtime/**,shell/**,simulator/**,scripts/**,react-native-overrides/**,example/**
sonar.cpd.exclusions=react-native-overrides/**

sonar.cs.file.suffixes=-

# Reviewed exceptions. Each entry is a rule that is wrong for one file, with the
# reason. Prefer a code fix over a new entry; when a file named here moves, its
# entry moves with it.
sonar.issue.ignore.multicriteria=sysinfokeys,playerstubs,dlogvarargs

# A Tizen system_info key is a URI Samsung spells with http
# ("http://tizen.org/feature/screen.width"). It names a feature the shim answers
# for; nothing fetches it, and the https spelling is a key no TV knows.
sonar.issue.ignore.multicriteria.sysinfokeys.ruleKey=c:S5332
sonar.issue.ignore.multicriteria.sysinfokeys.resourceKey=simulator/shims/src/system_info.c

# The simulator has no player: each stub keeps the exact signature of Tizen's
# media/player.h, which the host compiles against on a TV too, and ignores its
# arguments. A const it adds would no longer match that header.
sonar.issue.ignore.multicriteria.playerstubs.ruleKey=c:S995
sonar.issue.ignore.multicriteria.playerstubs.resourceKey=simulator/shims/src/player.c

# dlog_print is Tizen's variadic logging API, with this signature on a TV; the
# shim forwards to dlog_vprint, and the format attribute checks every caller.
sonar.issue.ignore.multicriteria.dlogvarargs.ruleKey=c:S923
sonar.issue.ignore.multicriteria.dlogvarargs.resourceKey=simulator/shims/src/dlog.c
