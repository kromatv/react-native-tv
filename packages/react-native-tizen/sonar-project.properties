# dlsym returns `void *`; only reinterpret_cast turns it into a function
# pointer (the C++ standard leaves that conversion to reinterpret_cast).
sonar.issue.ignore.multicriteria.renderS3630.ruleKey=cpp:S3630
sonar.issue.ignore.multicriteria.renderS3630.resourceKey=runtime/host/src/views/EvasFilter.cpp

# The image download engine and the shadow painting thread live as long as the
# process and are never destroyed, so no static destructor joins a worker
# thread at exit while another static still uses it.
sonar.issue.ignore.multicriteria.renderS5025a.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.renderS5025a.resourceKey=runtime/host/src/views/ImageFetcher.cpp
sonar.issue.ignore.multicriteria.renderS5025b.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.renderS5025b.resourceKey=runtime/host/src/views/ShadowPatches.cpp

# A scroll animation's step can start the next animation, which replaces the
# step while it runs: the step is copied before it is called.
sonar.issue.ignore.multicriteria.renderS6032.ruleKey=cpp:S6032
sonar.issue.ignore.multicriteria.renderS6032.resourceKey=runtime/host/src/views/ScrollAnimation.cpp

# ComponentView is the base of every native view: its methods are the hooks and
# accessors Fabric's mounting calls. TextInputView implements KeyboardClient's
# eight callbacks beside React Native's view methods. Splitting either would
# spread one lifecycle over several classes.
sonar.issue.ignore.multicriteria.renderS1448a.ruleKey=cpp:S1448
sonar.issue.ignore.multicriteria.renderS1448a.resourceKey=runtime/host/src/views/ComponentView.h
