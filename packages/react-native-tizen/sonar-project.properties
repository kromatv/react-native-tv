sonar.issue.ignore.multicriteria.expoVideoTizenPlayer.ruleKey=cpp:S1448
sonar.issue.ignore.multicriteria.expoVideoTizenPlayer.resourceKey=runtime/host/expo/modules/video/TizenPlayer.h

