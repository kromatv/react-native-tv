sonar.projectKey=kromatv_react-native-tizen
sonar.organization=kromatv
sonar.sourceEncoding=UTF-8

sonar.sources=src,runtime,shell,simulator,scripts,react-native-overrides,example/src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.fixtures.ts
sonar.exclusions=src/**/*.test.ts,src/**/*.fixtures.ts,**/node_modules/**,**/dist/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=runtime/**,shell/**,simulator/**,scripts/**,react-native-overrides/**,example/**
sonar.cpd.exclusions=react-native-overrides/**

sonar.cs.file.suffixes=-

# The runtime is compiled as C++20 (runtime/CMakeLists.txt): rules that ask for
# C++23 library features (std::to_underlying, std::ranges::contains,
# std::string::contains) do not apply.
sonar.cfamily.reportingCppStandardOverride=c++20

# Reviewed exceptions. Each entry is a rule that is wrong for one file, with the
# reason. Prefer a code fix over a new entry; when a file named here moves, its
# entry moves with it.
sonar.issue.ignore.multicriteria=\
  sysinfokeys,\
  playerstubs,\
  dlogvarargs,\
  rnModulesSpecConst,\
  rnModulesSpecNoOp,\
  rnModulesNetworkingSpec,\
  rnModulesSystemInfoKeys,\
  rnModulesFreeSystemInfo,\
  rnModulesFreeMarkup,\
  rnModulesReplacementCharacter,\
  privtv,\
  privmanifest,\
  privconfig,\
  echohttp,\
  nodepath,\
  remotekeys,\
  viewerpoll,\
  sysrootmem,\
  probeseq,\
  rnblob,\
  fsmd5,\
  expoModulesNoOpDirectory,\
  expoModulesNoOpFileSystem,\
  expoModulesCallbackImage,\
  expoModulesBootClock,\
  expoModulesCatchConstants,\
  expoModulesCatchImagePrefetch,\
  expoModulesCatchImageView,\
  expoVideoCallbackEvents,\
  expoVideoCallbackSubtitles,\
  expoVideoFreeEvents,\
  expoVideoFreeSubtitles,\
  expoVideoNoOpModule,\
  expoVideoNoOpView,\
  expoVideoPlayerApi,\
  expoVideoTizenPlayer,\
  renderS5008a,\
  renderS5008b,\
  renderS5008c,\
  renderS5008d,\
  renderS5008e,\
  renderS859a,\
  renderS859b,\
  renderS3630,\
  renderS5025a,\
  renderS5025b,\
  renderS6032,\
  renderS1448a,\
  renderS1448b

# A Tizen system_info key is a URI Samsung spells with http
# ("http://tizen.org/feature/screen.width"). It names a feature the shim answers
# for; nothing fetches it, and the https spelling is a key no TV knows.
sonar.issue.ignore.multicriteria.sysinfokeys.ruleKey=c:S5332
sonar.issue.ignore.multicriteria.sysinfokeys.resourceKey=simulator/shims/src/system_info.c

# The simulator has no player: each stub keeps the exact signature of Tizen's
# media/player.h, which the host compiles against on a TV too, and ignores its
# arguments. A const it adds would no longer match that header.
sonar.issue.ignore.multicriteria.playerstubs.ruleKey=c:S995
sonar.issue.ignore.multicriteria.playerstubs.resourceKey=simulator/shims/src/player.c

# dlog_print is Tizen's variadic logging API, with this signature on a TV; the
# shim forwards to dlog_vprint, and the format attribute checks every caller.
sonar.issue.ignore.multicriteria.dlogvarargs.ruleKey=c:S923
sonar.issue.ignore.multicriteria.dlogvarargs.resourceKey=simulator/shims/src/dlog.c

# A Tizen privilege or manifest metadata key is a URI Samsung spells with http
# ("http://tizen.org/privilege/internet"). It is a name a manifest declares, not
# an address anything fetches, and the https spelling is a different, unknown key.
sonar.issue.ignore.multicriteria.privtv.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.privtv.resourceKey=src/config/tv-features.ts
sonar.issue.ignore.multicriteria.privmanifest.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.privmanifest.resourceKey=src/package/feature-manifest.ts
sonar.issue.ignore.multicriteria.privconfig.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.privconfig.resourceKey=src/config/tizen-config.ts

# The example app checks plain HTTP on purpose, next to TLS: its echo peer is
# example/scripts/modules-echo-server.ts on the developer's machine, which has no
# certificate, and "https and http probed at once" needs both.
sonar.issue.ignore.multicriteria.echohttp.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.echohttp.resourceKey=example/src/screens/modules/echo-endpoint.ts

# rn-tizen is a developer CLI: it evaluates app.config.ts with the developer's
# own Node from PATH, as it runs sdb, tizen and dotnet. There is no fixed
# directory that holds Node on macOS, Linux and Windows alike.
sonar.issue.ignore.multicriteria.nodepath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.nodepath.resourceKey=src/app/expo-config.ts

# Remote keys are pressed one at a time with a pause between them, then the
# socket is polled until it has drained: the order and the waits are the point.
sonar.issue.ignore.multicriteria.remotekeys.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.remotekeys.resourceKey=src/remote/remote-session.ts

# Polls the simulator's port forward until it answers: each try waits for the last.
sonar.issue.ignore.multicriteria.viewerpoll.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.viewerpoll.resourceKey=src/simulator/viewer.ts

# Each shared library of a rootstrap is read whole to be patched. One at a time
# keeps memory to one library instead of a few hundred megabytes at once.
sonar.issue.ignore.multicriteria.sysrootmem.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.sysrootmem.resourceKey=src/sysroot/mirror-sysroot.ts

# The video probe plays one sample at a time and checks two players at once
# separately: a second player takes the decoder from the first (the resource
# conflict in docs/reference/tizen-media-playback.md).
sonar.issue.ignore.multicriteria.probeseq.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.probeseq.resourceKey=example/src/screens/video/probe-screen.tsx

# React Native's Blob has no text(): FileReader is how an app reads one, and the
# example checks that FileReader works on Tizen.
sonar.issue.ignore.multicriteria.rnblob.ruleKey=typescript:S7756
sonar.issue.ignore.multicriteria.rnblob.resourceKey=example/src/screens/modules/read-blob.ts

# The Tizen runtime implements expo-file-system's File.md5 and not yet
# File.digest(), which replaces it. The example checks what the runtime ships.
sonar.issue.ignore.multicriteria.fsmd5.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.fsmd5.resourceKey=example/src/screens/expo/file-system-screen.tsx

# cpp:S5817, TurboModule spec methods cannot be const: the generated specs pass &T::method to
# bridging::callFromJs, which takes only a non-const member pointer (ReactCommon/react/bridging/Class.h:14-20).
sonar.issue.ignore.multicriteria.rnModulesSpecConst.ruleKey=cpp:S5817
sonar.issue.ignore.multicriteria.rnModulesSpecConst.resourceKey=runtime/host/src/modules/**/*Module.cpp

# cpp:S1186, spec methods Tizen has nothing to do for (addListener, removeListeners, vibrate, announceForAccessibility...):
# the generated spec requires each one (FBReactNativeSpecJSI.h asserts its arity).
sonar.issue.ignore.multicriteria.rnModulesSpecNoOp.ruleKey=cpp:S1186
sonar.issue.ignore.multicriteria.rnModulesSpecNoOp.resourceKey=runtime/host/src/modules/**/*Module.cpp

# cpp:S107, sendRequest takes the runtime and the nine arguments of React Native's Networking spec
# (src/private/specs_DEPRECATED/modules/NativeNetworkingAndroid.js); the generated spec asserts 10 parameters.
sonar.issue.ignore.multicriteria.rnModulesNetworkingSpec.ruleKey=cpp:S107
sonar.issue.ignore.multicriteria.rnModulesNetworkingSpec.resourceKey=runtime/host/src/modules/NetworkingModule.cpp

# cpp:S5332, http://tizen.org/... strings are system_info keys, identifiers that nothing fetches
# (system/system_info.h, Tizen 9.0 rootstrap).
sonar.issue.ignore.multicriteria.rnModulesSystemInfoKeys.ruleKey=cpp:S5332
sonar.issue.ignore.multicriteria.rnModulesSystemInfoKeys.resourceKey=runtime/host/src/modules/DeviceProfile.cpp

# cpp:S1231, system_info_get_platform_string says "You must release the value using free()" (system_info.h:87);
# evas_textblock_text_utf8_to_markup returns allocated markup (evas_textblock_legacy.h:712).
sonar.issue.ignore.multicriteria.rnModulesFreeSystemInfo.ruleKey=cpp:S1231
sonar.issue.ignore.multicriteria.rnModulesFreeSystemInfo.resourceKey=runtime/host/src/modules/DeviceProfile.cpp
sonar.issue.ignore.multicriteria.rnModulesFreeMarkup.ruleKey=cpp:S1231
sonar.issue.ignore.multicriteria.rnModulesFreeMarkup.resourceKey=runtime/host/src/modules/dialog/AlertDialog.cpp

# cpp:S7040, the bounded form it asks for (\u{FFFD}) is C++23; the runtime builds as C++20 (runtime/CMakeLists.txt).
sonar.issue.ignore.multicriteria.rnModulesReplacementCharacter.ruleKey=cpp:S7040
sonar.issue.ignore.multicriteria.rnModulesReplacementCharacter.resourceKey=runtime/host/src/modules/blob/FileReaderModule.cpp

# cpp:S1186, expo-file-system functions Tizen has nothing to do for: Directory.validatePath and
# cancelDownloadAsync, as there is no download task to cancel (expo-modules-contract.md section 4).
sonar.issue.ignore.multicriteria.expoModulesNoOpDirectory.ruleKey=cpp:S1186
sonar.issue.ignore.multicriteria.expoModulesNoOpDirectory.resourceKey=runtime/host/expo/modules/filesystem/FileSystemDirectory.cpp
sonar.issue.ignore.multicriteria.expoModulesNoOpFileSystem.ruleKey=cpp:S1186
sonar.issue.ignore.multicriteria.expoModulesNoOpFileSystem.resourceKey=runtime/host/expo/modules/filesystem/FileSystemModule.cpp

# cpp:S5008, the void * data of Evas_Object_Event_Cb and Ecore_Timeline_Cb
# (evas-1/Evas_Common.h:482, ecore-1/Ecore_Common.h:2764, Tizen 9.0 rootstrap).
sonar.issue.ignore.multicriteria.expoModulesCallbackImage.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.expoModulesCallbackImage.resourceKey=runtime/host/expo/modules/image/ExpoImageView.cpp

# cpp:S6229, getUptimeAsync reads CLOCK_BOOTTIME, which counts while the TV is in standby;
# std::chrono has no such clock (libstdc++'s steady_clock is CLOCK_MONOTONIC).
sonar.issue.ignore.multicriteria.expoModulesBootClock.ruleKey=cpp:S6229
sonar.issue.ignore.multicriteria.expoModulesBootClock.resourceKey=runtime/host/expo/modules/ExpoDeviceModule.cpp

# cpp:S1181, failures that must reach JavaScript as a result, whatever their type: an unreadable app.config
# leaves the constants without a manifest, a failed download makes Image.prefetch false or sends onError.
sonar.issue.ignore.multicriteria.expoModulesCatchConstants.ruleKey=cpp:S1181
sonar.issue.ignore.multicriteria.expoModulesCatchConstants.resourceKey=runtime/host/expo/modules/ExponentConstantsModule.cpp
sonar.issue.ignore.multicriteria.expoModulesCatchImagePrefetch.ruleKey=cpp:S1181
sonar.issue.ignore.multicriteria.expoModulesCatchImagePrefetch.resourceKey=runtime/host/expo/modules/image/ExpoImageModule.cpp
sonar.issue.ignore.multicriteria.expoModulesCatchImageView.ruleKey=cpp:S1181
sonar.issue.ignore.multicriteria.expoModulesCatchImageView.resourceKey=runtime/host/expo/modules/image/ExpoImageView.cpp

# cpp:S5008, the void * user data of capi-media-player and Ecore callbacks
# (media/player.h:275-468, ecore-1/Ecore_Common.h:168, Tizen 9.0 rootstrap).
sonar.issue.ignore.multicriteria.expoVideoCallbackEvents.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.expoVideoCallbackEvents.resourceKey=runtime/host/expo/modules/video/TizenPlayerEvents.cpp
sonar.issue.ignore.multicriteria.expoVideoCallbackSubtitles.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.expoVideoCallbackSubtitles.resourceKey=runtime/host/expo/modules/video/SubtitleOverlay.cpp

# cpp:S1231, strings Tizen allocates for the caller to free(): player_get_codec_info (media/player.h:1558),
# player_get_track_language_code (player.h:2309), evas_textblock_text_utf8_to_markup (evas_textblock_legacy.h:712).
sonar.issue.ignore.multicriteria.expoVideoFreeEvents.ruleKey=cpp:S1231
sonar.issue.ignore.multicriteria.expoVideoFreeEvents.resourceKey=runtime/host/expo/modules/video/TizenPlayerEvents.cpp
sonar.issue.ignore.multicriteria.expoVideoFreeSubtitles.ruleKey=cpp:S1231
sonar.issue.ignore.multicriteria.expoVideoFreeSubtitles.resourceKey=runtime/host/expo/modules/video/SubtitleOverlay.cpp

# cpp:S1186, expo-video functions Tizen has nothing to do for: it has no video cache and no picture in picture
# (docs/reference/tizen-media-playback.md section 7).
sonar.issue.ignore.multicriteria.expoVideoNoOpModule.ruleKey=cpp:S1186
sonar.issue.ignore.multicriteria.expoVideoNoOpModule.resourceKey=runtime/host/expo/modules/video/VideoModule.cpp
sonar.issue.ignore.multicriteria.expoVideoNoOpView.ruleKey=cpp:S1186
sonar.issue.ignore.multicriteria.expoVideoNoOpView.resourceKey=runtime/host/expo/modules/video/VideoView.cpp

# cpp:S1448, VideoPlayer mirrors expo-video's VideoPlayer, about 30 properties with setters
# (docs/reference/expo-modules-contract.md section 4).
sonar.issue.ignore.multicriteria.expoVideoPlayerApi.ruleKey=cpp:S1448
sonar.issue.ignore.multicriteria.expoVideoPlayerApi.resourceKey=runtime/host/expo/modules/video/VideoPlayer.h

# cpp:S1448, TizenPlayer is the one owner of a capi-media-player handle and of its state machine (lending to the
