sonar.projectKey=kromatv_react-native-tizen
sonar.organization=kromatv
sonar.sourceEncoding=UTF-8

sonar.sources=src,runtime,shell,simulator,scripts,react-native-overrides,example/src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.exclusions=src/**/*.test.ts,**/node_modules/**,**/dist/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=runtime/**,shell/**,simulator/**,scripts/**,react-native-overrides/**,example/**
sonar.cpd.exclusions=react-native-overrides/**

sonar.cs.file.suffixes=-
