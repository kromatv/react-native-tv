sonar.projectKey=kromatv_react-native-tv
sonar.organization=kromatv
sonar.sourceEncoding=UTF-8

# SonarCloud analyses the whole package and takes no sonar.sources or
# sonar.tests for this project: what it must not analyse is excluded here.
sonar.exclusions=src/**/*.test.ts,src/**/*.fixtures.ts,**/node_modules/**,**/dist/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The entry point of the build's last step: it writes into dist/ when the
# package is built, which no unit test may do. What it calls is covered.
sonar.coverage.exclusions=src/build/build-platform-api.ts
