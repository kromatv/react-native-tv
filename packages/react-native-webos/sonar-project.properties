# The flag priorityPending only hints that the mutex-guarded queue has work: a
# missed store is caught by the runPriorityTasks call queued with it. The wait
# counters are statistics. runPriorityTasks reads the flag between every two
# mount mutations, where an acquire or seq_cst load costs an armv7 TV a barrier.
sonar.issue.ignore.multicriteria.relaxedMainThread.ruleKey=cpp:S8417
sonar.issue.ignore.multicriteria.relaxedMainThread.resourceKey=runtime/host/src/threading/MainThread.cpp

