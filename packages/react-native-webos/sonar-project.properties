# The example app checks plain HTTP on purpose, next to TLS: its echo peer is
# example/scripts/modules-echo-server.ts on the developer's machine, which has no
# certificate, and "https and http probed at once" needs both.
sonar.issue.ignore.multicriteria.echohttp.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.echohttp.resourceKey=example/src/screens/modules/echo-endpoint.ts

# Remote keys are pressed one at a time with a pause between them, then the
# socket is polled until it has drained: the order and the waits are the point.
sonar.issue.ignore.multicriteria.remotekeys.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.remotekeys.resourceKey=src/remote/remote-session.ts

# Polls the simulator's port forward until it answers: each try waits for the last.
sonar.issue.ignore.multicriteria.viewerpoll.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.viewerpoll.resourceKey=src/simulator/viewer.ts

# The video probe plays one sample at a time and checks two players at once
# separately: a second player may take the decoder from the first (uMediaServer's
# resource manager, docs/reference/webos-media-playback.md section 5).
sonar.issue.ignore.multicriteria.probeseq.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.probeseq.resourceKey=example/src/screens/video/probe-screen.tsx

# React Native's Blob has no text(): FileReader is how an app reads one, and the
# example checks that FileReader works on webOS.
sonar.issue.ignore.multicriteria.rnblob.ruleKey=typescript:S7756
sonar.issue.ignore.multicriteria.rnblob.resourceKey=example/src/screens/modules/read-blob.ts

