sonar.projectKey=kromatv_react-native-webos
sonar.organization=kromatv
sonar.sourceEncoding=UTF-8

sonar.sources=src,runtime,simulator,scripts,react-native-overrides,example/src
sonar.tests=src,runtime,scripts
sonar.test.inclusions=src/**/*.test.ts,runtime/**/*.test.cpp,scripts/**/*.test.ts,src/**/*.fixtures.ts,scripts/**/*.fixtures.ts,runtime/**/*.test.h
sonar.exclusions=src/**/*.test.ts,runtime/**/*.test.cpp,scripts/**/*.test.ts,**/node_modules/**,**/dist/**,src/**/*.fixtures.ts,scripts/**/*.fixtures.ts,runtime/**/*.test.h

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The C++ coverage report (coverage/runtime.xml) comes from CI's native job;
# the SonarCloud job passes it as sonar.coverageReportPaths when that job ran.
# runtime/ counts for coverage, apart from code no unit test can reach. The
# files below open the window and its OpenGL ES context, drive the app's
# lifecycle, load a TV's own libraries or need the GPU: the simulator's
# screenshots and a TV check them, not the doctest harness.
# Anything that needs only the main loop, a raster canvas, Hermes or a socket
# stays covered. runtime/compat builds for the TV's glibc only, so no test
# build compiles it.
sonar.coverage.exclusions=simulator/**,scripts/**,react-native-overrides/**,example/**,\
  runtime/compat/**,\
  runtime/host/src/ReactHost.*,\
  runtime/host/src/ReactHostInstance.cpp,\
  runtime/host/src/ReactHostWindow.cpp,\
  runtime/host/src/ReactHostDevSupport.cpp,\
  runtime/host/devsupport/DevSupport.*,\
  runtime/host/devsupport/LoadingBanner.*,\
  runtime/host/src/diagnostics/ErrorScreen.*,\
  runtime/host/src/diagnostics/PerfMonitor.*,\
  runtime/host/src/diagnostics/ScreenCapture.*,\
  runtime/host/src/fabric/SurfacePresenter.*,\
  runtime/host/src/input/ImeSession.*,\
  runtime/host/src/modules/dialog/**,\
  runtime/host/src/mounting/MountingManager.*,\
  runtime/host/expo/views/**,\
  runtime/host/expo/modules/ExpoKeepAwakeModule.cpp,\
  runtime/host/expo/modules/blur/ExpoBlurViews.cpp,\
  runtime/host/expo/modules/image/ExpoImageView.*,\
  runtime/host/expo/modules/video/VideoView.*,\
  runtime/host/expo/modules/video/VideoWindow.*,\
  runtime/host/src/platform/HostWindow.*,\
  runtime/host/src/platform/LibHelpersTransport.cpp,\
  runtime/host/src/platform/LunaClient.*,\
  runtime/host/src/ReactHostLifecycle.cpp
sonar.cpd.exclusions=react-native-overrides/**

# The runtime is compiled as C++20 (runtime/CMakeLists.txt): rules that ask for
# C++23 library features (std::to_underlying, std::ranges::contains,
# std::string::contains) do not apply.
sonar.cfamily.reportingCppStandardOverride=c++20

# No rule is ignored yet: SonarCloud has not analysed this repository. An
# exception goes here as a sonar.issue.ignore.multicriteria entry, one rule for
# one file, with its reason; prefer a code fix.
